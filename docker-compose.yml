services:
  songs-site:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Хост backend API, который сервер использует для SSR-запросов (см. utils/global.ts#getHost)
      - API_HOST=${API_HOST}
      - HOST=0.0.0.0
      - PORT=3000
    restart: unless-stopped
    networks:
      - shared

networks:
  shared:
    external: true
    name: songs-shared
